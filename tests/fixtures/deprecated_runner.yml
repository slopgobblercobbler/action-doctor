name: Deprecated Runner Workflow

on: [push]

permissions:
  contents: read

jobs:
  test-linux:
    name: Run on old Ubuntu
    runs-on: ubuntu-20.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

  test-matrix:
    name: Run on old Windows and Mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [windows-2019, macos-11]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
