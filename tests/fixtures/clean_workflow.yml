name: Clean Compliant Workflow

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16abce94cb522027ec595dacd5 # v4.2.0
        with:
          node-version: ${{ matrix.node }}

      - name: Build package
        run: |
          npm ci
          npm run build
